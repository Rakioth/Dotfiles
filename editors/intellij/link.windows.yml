- shell:
  -
    command: powershell -NoProfile -ExecutionPolicy Bypass -Command "$path = (Resolve-Path \"C:\Program Files (x86)\JetBrains\IntelliJ IDEA *\").Path; if ((Split-Path -Path $path -Leaf) -match '\d{4}\.\d') { $version = $matches[0] }; if (-not $version) { exit 1 }; New-Item -ItemType Directory -Path \"$env:APPDATA\JetBrains\IntelliJIdea$version\plugins\" -ErrorAction SilentlyContinue; Get-ChildItem -Path \"editors\intellij\settings\" | ForEach-Object { Remove-Item -Path \"$env:APPDATA\JetBrains\IntelliJIdea$version\$( $_.Name )\" -Recurse -Force; New-Item -ItemType SymbolicLink -Path \"$env:APPDATA\JetBrains\IntelliJIdea$version\$( $_.Name )\" -Target $_.FullName -Force }; New-Item -ItemType SymbolicLink -Path \"$env:APPDATA\JetBrains\IntelliJIdea$version\plugins\theme\" -Target \"editors\intellij\theme\" -Force; $extensions = Get-Content -Path \"editors\intellij\.idrc\"; & \"$path\bin\idea64.exe\" installPlugins $extensions"
    description: Link settings
